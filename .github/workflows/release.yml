name: Release

on:
  push:
    branches:
      - main
  # Builds and publishes an already tagged version, e.g. when semantic-release failed after pushing the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish (e.g. v4.2.2)'
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  release:
    name: Release new version
    # Nothing is released or deployed, if the tests fail.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Semantic Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx \
          -p semantic-release \
          -p @semantic-release/git \
          -p @semantic-release/changelog \
          semantic-release

      - name: Check for new release tag
        id: check_tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            NEW_TAG="$INPUT_TAG"
          else
            NEW_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          fi

          CLEAN_VERSION=${NEW_TAG#v}

          echo "tag=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      # semantic-release creates the GitHub release on push. A manual run only adds it when it's missing, using the
      # notes semantic-release wrote into the release commit.
      - name: Create missing GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$(git log -1 --format=%b "$TAG")"
          fi

      - name: Set up Docker Buildx
        if: steps.check_tag.outputs.tag != ''
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: steps.check_tag.outputs.tag != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check_tag.outputs.tag != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            hildedev/laneh:latest
            hildedev/laneh:${{ steps.check_tag.outputs.tag }}

      - name: Setup Java
        if: steps.check_tag.outputs.tag != ''
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Web Assets
        if: steps.check_tag.outputs.tag != ''
        run: CAPACITOR_BUILD=true npm run build

      - name: Sync Capacitor Android
        if: steps.check_tag.outputs.tag != ''
        run: npx cap sync android

      - name: Build Android App Bundle
        if: steps.check_tag.outputs.tag != ''
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -PversionName=${{ steps.check_tag.outputs.tag }} \
            -PversionCode=${{ github.run_number }}

      - name: Sign App Bundle
        if: steps.check_tag.outputs.tag != ''
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}
          alias: ${{ secrets.PLAYSTORE_KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.PLAYSTORE_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.PLAYSTORE_KEY_PASSWORD }}

      - name: Upload to Google Play Closed Testing
        if: steps.check_tag.outputs.tag != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
          packageName: dev.laneh.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: Beta test
          status: draft
