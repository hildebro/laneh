name: Test

on:
  # Pushes to main are tested by the release workflow, before anything is released.
  push:
    branches-ignore:
      - main
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint, check and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: laneh
          POSTGRES_PASSWORD: laneh
          POSTGRES_DB: laneh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laneh -d laneh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci

      # Also generates the paraglide messages, which the type check needs.
      - name: Test with PGlite
        run: npm test

      - name: Test with Postgres
        env:
          TEST_DATABASE_URL: postgres://laneh:laneh@localhost:5432/laneh_test
        run: npm test

      # Not `npm run lint`: eslint doesn't skip the generated .svelte-kit folder, and prettier isn't applied yet.
      - name: Lint
        run: npx eslint src scripts tests

      - name: Type check
        run: npm run check
