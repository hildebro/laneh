services:
  laneh-db:
    image: docker.io/postgres:17-bookworm
    restart: always
    ports:
      # Only reachable from this machine, e.g. for IntelliJ or drizzle-kit.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATABASE_LOCATION}:/var/lib/postgresql/data
    networks:
      - laneh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  laneh-app:
    build:
      context: .
      target: builder
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${APP_PORT}:5173"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@laneh-db:5432/${POSTGRES_DB}
      NODE_ENV: development
    volumes:
      - ./:/app
    depends_on:
      laneh-db:
        condition: service_healthy
    networks:
      - laneh-network
    # Run the migration script right before starting the dev server
    command: sh -c "npm install && node scripts/migrate.ts && npm run dev -- --host 0.0.0.0"

networks:
  laneh-network:
    driver: bridge
